<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>VOXELON</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    /* Touch devices: no pinch-zoom/scroll gestures, no long-press callouts or
       accidental text selection (inputs still type fine). */
    html, body { touch-action: none; -webkit-user-select: none; user-select: none;
                 -webkit-touch-callout: none; }
    #auth input { -webkit-user-select: text; user-select: text; }
    #app { width: 100%; height: 100%; position: relative; }
    canvas.game { display: block; image-rendering: pixelated; }

    .mc-font {
      font-family: 'Lucida Console', Monaco, monospace;
      font-weight: bold;
      color: #fff;
      /* Soft legibility shadow for text floating over the 3D scene (no chunky
         pixel drop-shadow). Panels on solid backgrounds override to none. */
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      letter-spacing: 0.5px;
    }

    /* Crosshair: vanilla-style plus with difference blending */
    #crosshair {
      position: absolute; left: 50%; top: 50%;
      width: 22px; height: 22px;
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;
      pointer-events: none;
      z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: #ddd;
    }
    #crosshair::before { left: 9px; top: 0; width: 4px; height: 22px; }
    #crosshair::after  { left: 0; top: 9px; width: 22px; height: 4px; }

    /* Hotbar */
    #hotbar {
      position: absolute; bottom: 8px; left: 50%;
      transform: translateX(-50%);
      display: flex;
      background: rgba(0,0,0,0.55);
      border: 2px solid #000;
      outline: 2px solid rgba(255,255,255,0.25);
      z-index: 10;
      pointer-events: none;
    }
    .slot {
      width: 48px; height: 48px;
      border: 2px solid #8b8b8b;
      border-right-color: #555; border-bottom-color: #555;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .slot.selected::after {
      content: ''; position: absolute; inset: -4px;
      border: 4px solid #fff;
      outline: 2px solid #000;
      z-index: 2;
    }
    .slot canvas { width: 36px; height: 36px; image-rendering: pixelated; }
    .slot .count {
      position: absolute; right: 2px; bottom: 0;
      font-size: 14px; pointer-events: none; z-index: 3;
    }

    /* Inventory panel */
    #inventory {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      display: none; flex-direction: column; gap: 6px;
      background: #c6c6c6;
      border: 3px solid;
      border-color: #fff #555 #555 #fff;
      padding: 10px 12px 12px;
      z-index: 25;
    }
    .inv-title { color: #3f3f3f; text-shadow: none; font-size: 15px; }
    /* Warfare panels (machine / turret / ship / faction Core): consistent modern
       chrome — flat bevel buttons with a subtle hover, no chunky text shadows. */
    .war-btn {
      flex: 1; font-size: 10px; padding: 6px 4px; cursor: pointer;
      border: 2px solid; border-color: #fff #555 #555 #fff;
      background: #6b6b6b; color: #fff; text-shadow: none;
      white-space: pre-line; transition: background 0.12s;
    }
    .war-btn:hover:enabled { background: #7c8b9c; }
    .war-btn:disabled { cursor: default; }
    .war-bar { position: relative; border: 2px solid #2a2a2a; background: #1c1c1c; }
    .war-bar span {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; font-size: 10px; text-shadow: none; color: #fff;
    }
    .inv-grid {
      display: grid; grid-template-columns: repeat(9, 48px);
    }
    .inv-hotbar { margin-top: 10px; }
    .inv-slot {
      background: #8b8b8b;
      border-color: #373737 #fff #fff #373737;
      cursor: pointer;
    }
    #cursor-stack {
      position: absolute; display: none; pointer-events: none; z-index: 40;
      width: 32px; height: 32px;
    }
    #cursor-stack canvas { width: 32px; height: 32px; image-rendering: pixelated; }
    #cursor-stack .count {
      position: absolute; right: -4px; bottom: -4px; font-size: 14px;
    }
    #tooltip {
      position: absolute; display: none; pointer-events: none; z-index: 41;
      background: rgba(16, 0, 16, 0.94);
      border: 2px solid #25015a;
      padding: 4px 8px; font-size: 14px;
    }

    /* Crafting is presented as a compact field workbench: the grid sits on an
       illuminated blueprint, with a pulsing energy path into the result. */
    .inv-top {
      min-height: 52px; display: flex; justify-content: center;
      position: relative; padding: 12px 14px;
      background:
        linear-gradient(rgba(105,200,255,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(105,200,255,.07) 1px, transparent 1px),
        linear-gradient(145deg, #343b45, #232830);
      background-size: 12px 12px, 12px 12px, auto;
      border: 2px solid; border-color: #758392 #171b20 #171b20 #758392;
      box-shadow: inset 0 0 22px rgba(42,157,210,.1);
    }
    .inv-top::before {
      content: 'FIELD ASSEMBLY'; position: absolute; left: 8px; top: -9px;
      padding: 2px 7px; background: #25313b; color: #8ee5ff;
      border: 1px solid #527487; font: bold 8px 'Lucida Console', monospace;
      letter-spacing: 1.5px; text-shadow: none;
    }
    .craft-row { display: flex; align-items: center; gap: 16px; }
    .craft-row .inv-slot {
      background: radial-gradient(circle at 45% 40%, #6c7882, #444c55);
      border-color: #26313a #8797a4 #8797a4 #26313a;
      box-shadow: inset 0 0 0 1px rgba(120,220,255,.08);
    }
    .craft-arrow {
      width: 54px; height: 12px; position: relative;
      background: #11171d; border: 2px solid #52616d;
      clip-path: polygon(0 24%, 72% 24%, 72% 0, 100% 50%, 72% 100%, 72% 76%, 0 76%);
      filter: drop-shadow(0 0 4px rgba(92,210,255,.25));
    }
    .craft-arrow div {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #45b8df, #d5f8ff);
      box-shadow: 0 0 10px #64ddff;
    }
    .craft-row .result-slot {
      transform: rotate(45deg); margin: 7px;
      border-color: #e7d78a #62551f #62551f #e7d78a;
      background: radial-gradient(circle, #7f733e, #36331f);
      box-shadow: 0 0 15px rgba(255,220,95,.28);
    }
    .craft-row .result-slot > * { transform: rotate(-45deg); }
    .flame {
      width: 14px; height: 14px; background: #555;
      display: flex; align-items: flex-end;
    }
    .flame div { width: 100%; height: 0%; background: #ff9010; }
    .result-slot { margin-left: 4px; }
    .durbar {
      position: absolute; left: 6px; bottom: 4px; height: 3px;
      display: none; z-index: 3; background: #5fe552;
    }

    /* Survival HUD */
    #status {
      position: absolute; bottom: 62px; left: 50%;
      transform: translateX(-50%);
      width: 444px; z-index: 10; pointer-events: none;
    }
    #status canvas { image-rendering: pixelated; }
    #hearts { position: absolute; left: 0; bottom: 0; }
    #energybar { position: absolute; right: 0; bottom: 0; }
    #bubbles { position: absolute; right: 0; bottom: 22px; }
    #armor { position: absolute; left: 0; bottom: 22px; }
    #ammo {
      position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%);
      z-index: 10; pointer-events: none; font-size: 18px; display: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); color: #fff;
    }

    #damage-flash {
      position: absolute; inset: 0; background: #f00;
      opacity: 0; pointer-events: none; z-index: 15;
    }

    #death {
      position: absolute; inset: 0; background: rgba(120, 0, 0, 0.55);
      display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 26px; z-index: 50;
    }
    #death h1 { font-size: 44px; }
    #death button {
      font-family: inherit; font-size: 18px; font-weight: bold;
      padding: 10px 36px; cursor: pointer;
      background: #8b8b8b; color: #fff; text-shadow: none;
      border: 3px solid; border-color: #fff #555 #555 #fff;
    }

    /* Pause menu (over the frozen first-person view; not the title panorama) */
    #pause {
      position: absolute; inset: 0; background: rgba(8, 8, 14, 0.55);
      display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; z-index: 22;
    }
    #pause h1 { font-size: 48px; letter-spacing: 4px; }
    #vault-accessibility {
      display: grid; grid-template-columns: auto 150px; gap: 7px 12px;
      padding: 10px 14px; background: rgba(8,10,16,.72);
      border: 1px solid #45506a; font-size: 10px; align-items: center;
    }
    #vault-accessibility label { display: contents; }
    #vault-accessibility input[type="range"] { width: 150px; }
    #vault-accessibility input[type="checkbox"] { justify-self: start; }
    body.reduced-motion *, body.photosensitivity-safe * {
      animation-duration: .001ms !important; animation-iteration-count: 1 !important;
    }
    body.reduced-motion .vault-cinematic { transition: none !important; }
    body.high-contrast-telegraphs .vault-boss-hud { filter: contrast(1.35); }
    body.vault-cinematic-active #crosshair { visibility: hidden; }

    /* Debug overlay (F3) */
    #debug {
      position: absolute; top: 4px; left: 4px;
      font-size: 14px; line-height: 19px;
      display: none; z-index: 10; pointer-events: none;
      white-space: pre;
    }
    #debug .line { background: rgba(80,80,80,0.45); padding: 0 4px; display: inline-block; }

    /* Title / pause menu over the live panorama */
    #overlay {
      position: absolute; inset: 0;
      background:
        linear-gradient(90deg, rgba(4,7,12,.7) 0%, transparent 28%, transparent 72%, rgba(4,7,12,.7) 100%),
        radial-gradient(ellipse at 50% 38%, rgba(32,69,91,.05) 0%, rgba(6,8,16,.44) 68%, rgba(2,4,8,.88) 100%),
        linear-gradient(rgba(8,8,14,.1), rgba(3,5,9,.7));
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; z-index: 20;
    }
    #overlay::before, #overlay::after {
      content: ''; position: absolute; pointer-events: none;
    }
    #overlay::before {
      inset: 20px; border: 1px solid rgba(166,215,236,.2);
      clip-path: polygon(0 0, 12% 0, 12% 1px, 88% 1px, 88% 0, 100% 0, 100% 100%, 88% 100%, 88% calc(100% - 1px), 12% calc(100% - 1px), 12% 100%, 0 100%);
    }
    #overlay::after {
      left: 50%; bottom: 0; width: min(720px, 88vw); height: 1px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, #58cbed, transparent);
      box-shadow: 0 0 24px #58cbed;
    }
    #overlay.hidden { display: none; }
    .title-lockup {
      text-align: center; position: relative; padding: 12px 36px 18px;
      animation: title-drop .7s cubic-bezier(.2,1.2,.4,1) both;
    }
    .title-lockup::before {
      content: ''; position: absolute; inset: 22% -6% 0;
      background: radial-gradient(ellipse, rgba(31,169,211,.17), transparent 68%);
      filter: blur(10px); z-index: -1;
    }
    .title-kicker {
      display: inline-flex; align-items: center; gap: 10px;
      color: #8fdcf5; font-size: 10px; letter-spacing: 5px;
      text-transform: uppercase; opacity: .9;
    }
    .title-kicker::before, .title-kicker::after {
      content: ''; width: 52px; height: 1px;
      background: linear-gradient(90deg, transparent, #78d9f5);
    }
    .title-kicker::after { transform: scaleX(-1); }
    #title {
      font-size: clamp(58px, 8vw, 106px); letter-spacing: clamp(7px, 1.2vw, 16px);
      margin: 5px 0 3px; line-height: .92; color: #ecf7fb;
      text-shadow:
        0 2px 0 #7b8d96, 0 5px 0 #17242c,
        0 12px 34px rgba(0,0,0,.85), 0 0 48px rgba(91,213,245,.25);
    }
    #title .accent {
      color: #ff5a45;
      text-shadow:
        0 2px 0 #8f3029, 0 5px 0 #321917,
        0 12px 34px rgba(0,0,0,.85), 0 0 40px rgba(255,75,48,.5);
    }
    @keyframes title-drop {
      from { transform: translateY(-26px) scale(1.05); opacity: 0; }
      to   { transform: none; opacity: 1; }
    }
    #overlay .subtitle {
      font-size: 11px; color: #d5e8ee; text-shadow: 0 1px 3px #000;
      margin-top: 7px; letter-spacing: 4px; text-transform: uppercase;
    }
    #overlay .subtitle .sub-dot { color: #55d5ff; }
    .season-chip {
      display: inline-block; margin-top: 12px; padding: 5px 12px;
      border: 1px solid rgba(108,216,244,.35); color: #a6e8fa;
      background: rgba(7,18,25,.62); font-size: 9px; letter-spacing: 2px;
      box-shadow: inset 0 0 12px rgba(60,196,232,.08);
    }
    /* Vanilla-style button (same bevel as the death screen). */
    .mc-btn {
      font-family: inherit; font-size: 20px; font-weight: bold;
      padding: 12px 64px; cursor: pointer;
      background: #6b6b6b; color: #fff; text-shadow: none;
      border: 3px solid; border-color: #fff #555 #555 #fff;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      transition: background 0.12s, transform 0.08s;
    }
    .mc-btn:hover { background: #7c8b9c; transform: translateY(-1px); }
    .mc-btn:active { transform: translateY(1px); }
    /* The big Play (Civilization) button pops. */
    #play-btn {
      min-width: 300px; background: linear-gradient(135deg, #ee5b3e, #a62f2a);
      border-color: #ffb093 #511a1a #511a1a #ffb093;
      letter-spacing: 4px; box-shadow: 0 6px 20px rgba(0,0,0,.45), 0 0 24px rgba(255,67,42,.25);
    }
    #play-btn:hover { background: linear-gradient(135deg, #ff704f, #bd3930); }
    /* Character: a violet button under Civilization — customise your avatar. */
    #character-btn {
      background: linear-gradient(#8a5fd6, #6a41b0);
      border-color: #d6bdff #35205e #35205e #d6bdff;
      color: #f3ecff; text-shadow: 0 1px 0 rgba(40, 20, 80, 0.6);
      letter-spacing: 2px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35), 0 0 22px rgba(150, 100, 255, 0.35);
    }
    #character-btn:hover { background: linear-gradient(#9a6fe6, #7a4fc4); }
    /* Login / register form on the title overlay — a soft card. */
    #auth {
      display: flex; flex-direction: column; gap: 8px; width: 310px; margin: 0 0 4px;
      background: linear-gradient(145deg, rgba(17,28,37,.88), rgba(7,11,17,.9));
      border: 1px solid #38515e; border-radius: 2px;
      padding: 18px 20px 16px;
      box-shadow: 0 16px 45px rgba(0,0,0,.6), inset 0 0 24px rgba(58,177,216,.04);
      backdrop-filter: blur(7px);
    }
    #auth input {
      font-size: 14px; padding: 9px 10px; color: #eee; background: #0f1420;
      border: 2px solid; border-color: #2a3550 #4a5775 #4a5775 #2a3550; text-shadow: none;
      border-radius: 4px;
      outline: none;
    }
    #auth input:focus { border-color: #6fd0ff; }
    #auth input[readonly] { color: #cfe0ff; cursor: default; }
    /* Auth buttons are compact + centered (the big 64px padding is for Play). */
    #auth .mc-btn {
      font-size: 18px; padding: 10px 12px; text-align: center;
      display: flex; align-items: center; justify-content: center;
    }
    #submit-btn { width: 100%; }
    #auth-user-row { display: flex; gap: 8px; align-items: stretch; }
    #auth-user-row #auth-user { flex: 1; min-width: 0; }
    #roll-btn { flex: 0 0 auto; padding: 10px 14px; font-size: 18px; }
    #auth-toggle { font-size: 12px; color: #9fb4cc; text-shadow: none; text-align: center; }
    #toggle-link { color: #6fd0ff; cursor: pointer; text-decoration: underline; }
    #auth-err { color: #ff8a7a; font-size: 12px; min-height: 14px; text-shadow: none; text-align: center; }
    #auth-status { color: #9fb4cc; font-size: 12px; min-height: 14px; text-shadow: none; text-align: center; }
    #menu-btns {
      padding: 18px 24px !important; min-width: 350px;
      background: linear-gradient(145deg, rgba(17,28,37,.86), rgba(7,11,17,.88));
      border: 1px solid #38515e; box-shadow: 0 16px 45px rgba(0,0,0,.55);
      backdrop-filter: blur(7px);
    }
    #menu-btns .mc-btn:not(#play-btn) { min-width: 260px; font-size: 15px; padding: 9px 28px; }
    @media (max-width: 640px), (max-height: 720px) {
      #overlay { gap: 8px; }
      .title-lockup { padding: 5px 20px 8px; }
      .title-kicker, .season-chip { display: none; }
      #title { font-size: clamp(44px, 14vw, 70px); }
      #overlay .subtitle { font-size: 9px; }
      #auth { padding: 12px 14px; width: min(310px, 86vw); }
      #menu-btns { min-width: min(350px, 90vw); padding: 12px !important; }
    }

  </style>
</head>
<body>
  <div id="app">
    <div id="crosshair"></div>
    <div id="ammo" class="mc-font"></div>
    <div id="hotbar"></div>
    <div id="status">
      <canvas id="hearts" width="202" height="40"></canvas>
      <canvas id="energybar" width="202" height="20"></canvas>
      <canvas id="bubbles" width="202" height="20"></canvas>
      <canvas id="armor" width="202" height="20"></canvas>
    </div>
    <div id="damage-flash"></div>
    <div id="death">
      <h1 class="mc-font">You died!</h1>
      <button id="respawn" class="mc-font">Respawn</button>
    </div>
    <div id="pause">
      <h1 class="mc-font">Paused</h1>
      <div id="vault-accessibility" class="mc-font">
        <label>Music <input id="music-volume" type="range" min="0" max="1" step="0.05" /></label>
        <label>Effects <input id="effects-volume" type="range" min="0" max="1" step="0.05" /></label>
        <label>Camera shake <input id="camera-shake" type="range" min="0" max="1" step="0.1" /></label>
        <label>Reduced motion <input id="reduced-motion" type="checkbox" /></label>
        <label>High-contrast telegraphs <input id="contrast-telegraphs" type="checkbox" /></label>
        <label>Photosensitivity safe <input id="safe-effects" type="checkbox" /></label>
      </div>
      <button id="resume-btn" class="mc-btn">Resume</button>
      <button id="quit-btn" class="mc-btn">Quit to Title</button>
    </div>
    <div id="debug" class="mc-font"></div>
    <div id="overlay" class="hidden">
      <div class="title-lockup">
        <div class="title-kicker mc-font">A world worth fighting for</div>
        <h1 id="title" class="mc-font"><span class="accent">VOXEL</span>ON</h1>
        <p class="subtitle mc-font">mine <span class="sub-dot">◆</span> build <span class="sub-dot">◆</span> conquer <span class="sub-dot">◆</span> survive</p>
        <div class="season-chip mc-font">LIFESTEAL CIVILIZATIONS</div>
      </div>
      <div id="auth">
        <div id="auth-user-row">
          <input id="auth-user" class="mc-font" placeholder="username" maxlength="16" autocomplete="username" readonly />
          <button id="roll-btn" class="mc-btn" type="button" title="Roll a new random username">🎲</button>
        </div>
        <input id="auth-pass" class="mc-font" type="password" placeholder="password" autocomplete="current-password" />
        <button id="submit-btn" class="mc-btn">Register</button>
        <div id="auth-toggle" class="mc-font">Already have an account? <a id="toggle-link">Log in</a></div>
        <div id="auth-err" class="mc-font"></div>
        <div id="auth-status" class="mc-font"></div>
      </div>
      <div id="menu-btns" style="display:none; flex-direction:column; gap:12px; align-items:center;">
        <button id="play-btn" class="mc-btn">Civilization</button>
        <button id="character-btn" class="mc-btn">Character</button>
        <button id="controls-btn" class="mc-btn">Controls</button>
        <button id="logout-btn" class="mc-btn" style="font-size:14px;padding:7px 28px;opacity:0.85;">Log Out</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
