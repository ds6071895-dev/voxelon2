<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>VOXELON</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --hotbar-slot: clamp(32px, 10.2vw, 48px);
    }
    html, body { width: 100%; height: 100%; min-height: 100dvh; overflow: hidden; background: #000; }
    /* Touch devices: no pinch-zoom/scroll gestures, no long-press callouts or
       accidental text selection (inputs still type fine). */
    html, body { touch-action: none; -webkit-user-select: none; user-select: none;
                 -webkit-touch-callout: none; }
    #auth input { -webkit-user-select: text; user-select: text; }
    #app { width: 100%; height: 100%; min-height: 100dvh; position: relative; overflow: hidden; }
    canvas.game { display: block; image-rendering: pixelated; }

    .mc-font {
      font-family: 'Lucida Console', Monaco, monospace;
      font-weight: bold;
      color: #fff;
      /* Soft legibility shadow for text floating over the 3D scene (no chunky
         pixel drop-shadow). Panels on solid backgrounds override to none. */
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      letter-spacing: 0.5px;
    }

    /* Crosshair: vanilla-style plus with difference blending */
    #crosshair {
      position: absolute; left: 50%; top: 50%;
      width: 22px; height: 22px;
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;
      pointer-events: none;
      z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: #ddd;
    }
    #crosshair::before { left: 9px; top: 0; width: 4px; height: 22px; }
    #crosshair::after  { left: 0; top: 9px; width: 22px; height: 4px; }

    /* Hotbar */
    #hotbar {
      position: absolute; bottom: calc(8px + var(--safe-bottom)); left: 50%;
      transform: translateX(-50%);
      display: flex;
      background: rgba(0,0,0,0.55);
      border: 2px solid #000;
      outline: 2px solid rgba(255,255,255,0.25);
      z-index: 10;
      pointer-events: none;
    }
    .slot {
      width: var(--hotbar-slot); height: var(--hotbar-slot);
      border: 2px solid #8b8b8b;
      border-right-color: #555; border-bottom-color: #555;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .slot.selected::after {
      content: ''; position: absolute; inset: -4px;
      border: 4px solid #fff;
      outline: 2px solid #000;
      z-index: 2;
    }
    .slot canvas { width: calc(var(--hotbar-slot) * .75); height: calc(var(--hotbar-slot) * .75); image-rendering: pixelated; }
    .slot .count {
      position: absolute; right: 2px; bottom: 0;
      font-size: 14px; pointer-events: none; z-index: 3;
    }

    /* Inventory panel */
    #inventory {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      display: none; flex-direction: column; gap: 6px;
      background: #c6c6c6;
      border: 3px solid;
      border-color: #fff #555 #555 #fff;
      padding: 10px 12px 12px;
      z-index: 25;
    }
    .inv-title { color: #3f3f3f; text-shadow: none; font-size: 15px; }
    /* Warfare panels (machine / turret / ship / faction Core): consistent modern
       chrome — flat bevel buttons with a subtle hover, no chunky text shadows. */
    .war-btn {
      flex: 1; font-size: 10px; padding: 6px 4px; cursor: pointer;
      border: 2px solid; border-color: #fff #555 #555 #fff;
      background: #6b6b6b; color: #fff; text-shadow: none;
      white-space: pre-line; transition: background 0.12s;
    }
    .war-btn:hover:enabled { background: #7c8b9c; }
    .war-btn:disabled { cursor: default; }
    .war-bar { position: relative; border: 2px solid #2a2a2a; background: #1c1c1c; }
    .war-bar span {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; font-size: 10px; text-shadow: none; color: #fff;
    }
    .inv-grid {
      display: grid; grid-template-columns: repeat(9, 48px); gap: 0;
    }
    .inv-hotbar { margin-top: 8px; }
    .inv-slot {
      width: 48px; height: 48px;
      background: #8b8b8b;
      border-width: 1px;
      border-color: #373737 #fff #fff #373737;
      cursor: pointer;
    }
    #cursor-stack {
      position: absolute; display: none; pointer-events: none; z-index: 40;
      width: 32px; height: 32px;
    }
    #cursor-stack canvas { width: 32px; height: 32px; image-rendering: pixelated; }
    #cursor-stack .count {
      position: absolute; right: -4px; bottom: -4px; font-size: 14px;
    }
    #tooltip {
      position: absolute; display: none; pointer-events: none; z-index: 41;
      background: rgba(16, 0, 16, 0.94);
      border: 2px solid #25015a;
      padding: 4px 8px; font-size: 14px;
    }

    /* Crafting is presented as a compact field workbench: the grid sits on an
       illuminated blueprint, with a pulsing energy path into the result. */
    .inv-top {
      min-height: 52px; display: flex; justify-content: center;
      position: relative; padding: 12px 14px;
      background:
        linear-gradient(rgba(105,200,255,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(105,200,255,.07) 1px, transparent 1px),
        linear-gradient(145deg, #343b45, #232830);
      background-size: 12px 12px, 12px 12px, auto;
      border: 2px solid; border-color: #758392 #171b20 #171b20 #758392;
      box-shadow: inset 0 0 22px rgba(42,157,210,.1);
    }
    .craft-row { display: flex; align-items: center; gap: 16px; }
    .craft-row .inv-slot {
      background: radial-gradient(circle at 45% 40%, #6c7882, #444c55);
      border-color: #26313a #8797a4 #8797a4 #26313a;
      box-shadow: inset 0 0 0 1px rgba(120,220,255,.08);
    }
    .craft-arrow {
      width: 54px; height: 12px; position: relative;
      background: #11171d; border: 2px solid #52616d;
      clip-path: polygon(0 24%, 72% 24%, 72% 0, 100% 50%, 72% 100%, 72% 76%, 0 76%);
      filter: drop-shadow(0 0 4px rgba(92,210,255,.25));
    }
    .craft-arrow div {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #45b8df, #d5f8ff);
      box-shadow: 0 0 10px #64ddff;
    }
    .craft-row .result-slot {
      transform: rotate(45deg); margin: 7px;
      border-color: #e7d78a #62551f #62551f #e7d78a;
      background: radial-gradient(circle, #7f733e, #36331f);
      box-shadow: 0 0 15px rgba(255,220,95,.28);
    }
    .craft-row .result-slot > * { transform: rotate(-45deg); }
    .flame {
      width: 14px; height: 14px; background: #555;
      display: flex; align-items: flex-end;
    }
    .flame div { width: 100%; height: 0%; background: #ff9010; }
    .result-slot { margin-left: 4px; }
    .durbar {
      position: absolute; left: 6px; bottom: 4px; height: 3px;
      display: none; z-index: 3; background: #5fe552;
    }

    /* Survival HUD */
    #status {
      position: absolute; bottom: calc(var(--hotbar-slot) + 14px + var(--safe-bottom)); left: 50%;
      transform: translateX(-50%);
      width: min(444px, calc(100vw - var(--safe-left) - var(--safe-right) - 16px)); z-index: 10; pointer-events: none;
      transform-origin: bottom center;
    }
    #status canvas { image-rendering: pixelated; }
    #hearts { position: absolute; left: 0; bottom: 0; }
    #energybar { position: absolute; right: 0; bottom: 0; }
    #bubbles { position: absolute; right: 0; bottom: 22px; }
    #armor { position: absolute; left: 0; bottom: 22px; }
    #ammo {
      position: absolute; bottom: calc(var(--hotbar-slot) + 48px + var(--safe-bottom)); left: 50%; transform: translateX(-50%);
      z-index: 10; pointer-events: none; font-size: 18px; display: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); color: #fff;
    }

    #damage-flash {
      position: absolute; inset: 0; background: #f00;
      opacity: 0; pointer-events: none; z-index: 15;
    }

    #death {
      position: absolute; inset: 0; background: rgba(120, 0, 0, 0.55);
      display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 26px; z-index: 50;
    }
    #death h1 { font-size: 44px; }
    #death button {
      font-family: inherit; font-size: 18px; font-weight: bold;
      padding: 10px 36px; cursor: pointer;
      background: #8b8b8b; color: #fff; text-shadow: none;
      border: 3px solid; border-color: #fff #555 #555 #fff;
    }

    /* Pause menu (over the frozen first-person view; not the title panorama) */
    #pause {
      position: absolute; inset: 0; background: rgba(8, 8, 14, 0.55);
      display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; z-index: 22;
    }
    #pause h1 { font-size: 48px; letter-spacing: 4px; }
    #vault-accessibility {
      display: grid; grid-template-columns: auto 150px; gap: 7px 12px;
      padding: 10px 14px; background: rgba(8,10,16,.72);
      border: 1px solid #45506a; font-size: 10px; align-items: center;
    }
    #vault-accessibility label { display: contents; }
    #vault-accessibility input[type="range"] { width: 150px; }
    #vault-accessibility input[type="checkbox"] { justify-self: start; }
    body.reduced-motion *, body.photosensitivity-safe * {
      animation-duration: .001ms !important; animation-iteration-count: 1 !important;
    }
    body.reduced-motion .vault-cinematic { transition: none !important; }
    body.high-contrast-telegraphs .vault-boss-hud { filter: contrast(1.35); }
    body:not(.in-game) .vault-boss-hud { display: none !important; }
    body.vault-cinematic-active { cursor: none; }
    body.vault-cinematic-active #app > *:not(canvas.game):not(.vault-cinematic) {
      visibility: hidden !important; opacity: 0 !important; pointer-events: none !important;
    }
    body.vault-cinematic-active #app > .vault-cinematic {
      visibility: visible !important; opacity: 1;
    }
    body.vault-cinematic-active canvas.game { visibility: visible !important; }
    .vault-cinematic { contain: layout paint; }
    .vault-cinematic::before, .vault-cinematic::after {
      content: ''; position: absolute; left: 0; right: 0; height: 1px; opacity: .8;
      background: linear-gradient(90deg, transparent, currentColor, transparent);
      box-shadow: 0 0 22px currentColor;
    }
    .vault-cinematic::before { top: 12vh; }
    .vault-cinematic::after { bottom: 12vh; }



    /* In-game Field Guide */
    .field-guide { position:absolute; inset:0; z-index:28; display:none; padding:clamp(10px,2vw,24px); background:rgba(1,6,11,.72); color:#dcecf2; pointer-events:auto; }
    .field-guide.open { display:flex; }
    .field-guide-shell { width:100%; min-height:0; display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; background:linear-gradient(180deg,rgba(8,18,27,.97),rgba(3,10,16,.98)); border:1px solid rgba(99,217,255,.42); box-shadow:0 24px 80px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.025); overflow:hidden; }
    .field-guide-header { display:grid; grid-template-columns:minmax(220px,1fr) minmax(260px,520px) auto; gap:18px; align-items:center; padding:16px 18px; border-bottom:1px solid rgba(99,217,255,.22); background:linear-gradient(90deg,rgba(27,93,118,.22),transparent 55%); }
    .field-guide-header h1 { margin:2px 0 0; font-size:clamp(22px,2.6vw,38px); letter-spacing:.12em; color:#eafaff; }
    .field-guide-eyebrow { font-size:10px; letter-spacing:.24em; color:#65dcff; }
    .field-guide-search-label { display:grid; gap:5px; font-size:10px; letter-spacing:.12em; color:#9cc3d2; }
    .field-guide-search-label input { min-height:44px; padding:0 14px; color:#effcff; background:rgba(1,8,13,.82); border:1px solid rgba(99,217,255,.35); outline:none; font:inherit; }
    .field-guide-search-label input:focus { border-color:#65dcff; box-shadow:0 0 0 2px rgba(101,220,255,.2); }
    .field-guide-header-actions { display:flex; gap:8px; }
    #guide-close-btn { min-width:46px; font-size:24px; padding:5px 12px; }
    .field-guide-live-warning { padding:9px 18px; color:#ffe9ad; background:rgba(115,72,10,.38); border-bottom:1px solid rgba(255,195,84,.35); font-size:12px; }
    .field-guide-body { min-height:0; display:grid; grid-template-columns:250px minmax(0,1fr); position:relative; }
    .field-guide-nav { min-height:0; overflow:auto; padding:10px; border-right:1px solid rgba(99,217,255,.18); background:rgba(2,9,14,.7); }
    .field-guide-nav-item { width:100%; min-height:44px; display:grid; grid-template-columns:24px 1fr auto; gap:8px; align-items:center; margin:0 0 5px; padding:9px 10px; color:#afcbd5; text-align:left; background:transparent; border:1px solid transparent; cursor:pointer; font:inherit; }
    .field-guide-nav-item:hover,.field-guide-nav-item:focus-visible { color:#fff; border-color:rgba(99,217,255,.28); outline:none; }
    .field-guide-nav-item[data-active="true"] { color:#effcff; background:linear-gradient(90deg,rgba(56,174,214,.28),rgba(56,174,214,.05)); border-color:rgba(99,217,255,.42); }
    .field-guide-nav-item small { color:#65dcff; }
    .field-guide-content { min-height:0; overflow:auto; scroll-behavior:smooth; padding:clamp(18px,3vw,42px); outline:none; }
    .field-guide-article-header { display:flex; gap:16px; align-items:flex-start; padding-bottom:20px; border-bottom:1px solid rgba(99,217,255,.16); }
    .field-guide-article-header>span { font-size:30px; color:#65dcff; }
    .field-guide-article-header h2 { margin:0; font-size:clamp(26px,3vw,42px); letter-spacing:.04em; }
    .field-guide-article-header p { margin:8px 0 0; color:#9db9c4; line-height:1.6; }
    .field-guide-entry { max-width:1000px; margin:28px 0; padding:20px; background:rgba(10,24,34,.72); border:1px solid rgba(99,217,255,.16); }
    .field-guide-entry h3 { margin:0 0 14px; color:#c9f2ff; font-size:21px; }
    .field-guide-entry p,.field-guide-entry li { line-height:1.65; }
    .field-guide-entry ul,.field-guide-entry ol { padding-left:22px; }
    .field-guide-steps { counter-reset:guide-step; list-style:none; padding:0!important; display:grid; gap:8px; }
    .field-guide-steps li { counter-increment:guide-step; padding:10px 12px 10px 48px; position:relative; background:rgba(255,255,255,.025); }
    .field-guide-steps li::before { content:counter(guide-step,decimal-leading-zero); position:absolute; left:12px; color:#65dcff; }
    .field-guide-callout { margin:18px 0 0; padding:14px 16px; border-left:3px solid; }
    .field-guide-callout p { margin:5px 0 0; }
    .field-guide-callout.tip { background:rgba(28,116,146,.2); border-color:#65dcff; }
    .field-guide-callout.warning { background:rgba(137,75,17,.22); border-color:#ffb85c; color:#ffe7bd; }
    .field-guide-table-wrap { overflow:auto; }
    .field-guide table { width:100%; border-collapse:collapse; min-width:560px; }
    .field-guide th,.field-guide td { padding:10px 12px; border:1px solid rgba(130,188,207,.18); text-align:left; vertical-align:top; }
    .field-guide th { color:#86dffb; background:rgba(50,142,174,.16); }
    .field-guide-boss { padding:12px 0; border-bottom:1px solid rgba(255,255,255,.08); }
    .field-guide-boss h3 { margin-bottom:5px; }
    .field-guide-footer { min-height:54px; display:grid; grid-template-columns:1fr auto auto; gap:18px; align-items:center; padding:8px 16px; color:#87a8b4; border-top:1px solid rgba(99,217,255,.18); font-size:11px; }
    .field-guide-mobile-sections { display:none; }
    .field-guide button:focus-visible { outline:2px solid #65dcff; outline-offset:2px; }
    @media (max-width:800px) {
      .field-guide { padding:0; }
      .field-guide-header { grid-template-columns:1fr auto; gap:10px; padding:12px; }
      .field-guide-search-label { grid-column:1/-1; grid-row:2; }
      .field-guide-header-actions #guide-resume-btn { display:none; }
      .field-guide-body { display:block; }
      .field-guide-mobile-sections { display:block; position:absolute; top:8px; left:8px; z-index:2; min-height:44px; }
      .field-guide-nav { display:none; position:absolute; inset:60px 8px 8px; z-index:3; border:1px solid rgba(99,217,255,.4); box-shadow:0 18px 50px rgba(0,0,0,.7); }
      .field-guide-nav.mobile-open { display:block; }
      .field-guide-content { height:100%; padding:68px 14px 24px; }
      .field-guide-entry { padding:15px; }
      .field-guide-footer { grid-template-columns:1fr auto; }
      .field-guide-footer>span:nth-child(2) { display:none; }
    }
    @media (prefers-reduced-motion:reduce) { .field-guide * { scroll-behavior:auto!important; transition:none!important; animation:none!important; } }

    /* Debug overlay (F3) */
    #debug {
      position: absolute; top: 4px; left: 4px;
      font-size: 14px; line-height: 19px;
      display: none; z-index: 10; pointer-events: none;
      white-space: pre;
    }
    #debug .line { background: rgba(80,80,80,0.45); padding: 0 4px; display: inline-block; }

    /* ── Sheet: the shared full-screen card used by Controls and the guide ──
       Scrolls internally and pins its header, so long content can never be
       silently clipped the way a bare centred column was. */
    .sheet-scrim {
      position: absolute; inset: 0; z-index: 24; display: none;
      align-items: center; justify-content: center;
      justify-content: safe center;
      padding: calc(20px + var(--safe-top)) calc(18px + var(--safe-right))
               calc(20px + var(--safe-bottom)) calc(18px + var(--safe-left));
      background: rgba(4, 8, 13, .88); backdrop-filter: blur(10px);
      overflow-y: auto; overscroll-behavior: contain;
    }
    .sheet-card {
      display: flex; flex-direction: column; width: min(720px, 100%);
      max-height: 100%; min-height: 0;
      padding: clamp(20px, 3.2vw, 30px);
      border: 1px solid rgba(215, 232, 245, .14); border-radius: 15px;
      background: linear-gradient(180deg, rgba(18, 25, 34, .96), rgba(7, 11, 17, .98));
      box-shadow: 0 30px 72px rgba(0, 0, 0, .62), inset 0 1px rgba(255, 255, 255, .08);
      color: #dfe9f1;
    }
    .sheet-head { flex: 0 0 auto; padding-bottom: 16px; border-bottom: 1px solid rgba(215, 232, 245, .12); }
    .sheet-eyebrow { color: #f0b429; font-size: 9px; letter-spacing: 2.6px; text-transform: uppercase; text-shadow: none; }
    .sheet-title { margin-top: 9px; color: #f4f8fb; font-size: clamp(21px, 4vw, 28px); letter-spacing: 1.5px; text-shadow: none; }
    .sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 4px 4px 0; margin-right: -4px; }
    .sheet-body::-webkit-scrollbar { width: 8px; }
    .sheet-body::-webkit-scrollbar-thumb { background: rgba(215, 232, 245, .16); border-radius: 4px; }
    .sheet-close {
      flex: 0 0 auto; align-self: center; margin-top: 18px; min-height: 44px; padding: 11px 34px;
      border: 0 !important; border-radius: 10px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
      color: #17120a; background: linear-gradient(180deg, #ffdf9c, #eda81f) !important;
      box-shadow: 0 9px 24px rgba(237, 168, 31, .28);
    }

    /* Keybinding groups */
    .keygroup { margin-top: 22px; }
    .keygroup:first-child { margin-top: 14px; }
    .keygroup-title {
      margin-bottom: 6px; color: #8ea3b3; font-size: 9px; letter-spacing: 2.4px;
      text-transform: uppercase; text-shadow: none;
    }
    .keyrow {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 9px 0; border-bottom: 1px solid rgba(215, 232, 245, .07);
    }
    .keyrow:last-child { border-bottom: 0; }
    .keyrow-action { color: #cfdce6; font-size: 12px; text-shadow: none; }
    .keyrow-keys { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; justify-content: flex-end; }
    .keyrow-combo { display: inline-flex; gap: 3px; }
    .keyrow-sep { color: #5d707e; font-size: 10px; font-style: normal; }
    .keyrow-hint { color: #7c8f9d; font-size: 10px; font-style: normal; letter-spacing: .4px; }
    .keyrow-keys kbd {
      display: inline-block; padding: 5px 9px; border-radius: 6px;
      border: 1px solid rgba(215, 232, 245, .16); border-bottom-width: 2px;
      background: rgba(0, 0, 0, .5); color: #ffdf9c;
      font-family: inherit; font-size: 11px; letter-spacing: .6px; text-shadow: none; white-space: nowrap;
    }
    @media (max-width: 560px) {
      .keyrow { flex-direction: column; align-items: flex-start; gap: 6px; }
      .keyrow-keys { justify-content: flex-start; }
    }

    /* ── Title screen ─────────────────────────────────────────────────────
       One centred column over the live panorama: crest, wordmark, tagline and
       a single focused card. The sky reads through a soft ink wash rather than
       being boxed in by frames, scanlines and orbital rings, and the type
       carries the hierarchy instead of a dozen competing accent colours. */
    #overlay {
      position: absolute; inset: 0; z-index: 20; overflow-y: auto; overscroll-behavior: contain;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center;
      justify-content: safe center; /* never clip the crest on short viewports */
      overflow-x: hidden;
      gap: clamp(18px, 3.2vh, 38px);
      padding: calc(30px + var(--safe-top)) calc(20px + var(--safe-right))
               calc(26px + var(--safe-bottom)) calc(20px + var(--safe-left));
      background:
        radial-gradient(ellipse 74% 58% at 50% 44%,
          rgba(4,8,13,.88), rgba(4,8,13,.40) 64%, rgba(4,8,13,0) 100%),
        linear-gradient(180deg, rgba(4,8,13,.78) 0%, rgba(4,8,13,.18) 26%,
          rgba(4,8,13,.26) 58%, rgba(2,4,8,.94) 100%);
      color: #e8eef3; -webkit-tap-highlight-color: transparent;
    }
    #overlay.hidden { display: none; }
    /* One slow warm sweep across the sky — the only ambient motion up here. */
    #overlay::before {
      content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(ellipse 42% 56% at 30% 22%, rgba(255,196,102,.19), transparent 70%);
      background-size: 165% 165%; background-position: 0% 0%;
      animation: title-drift 34s ease-in-out infinite alternate;
    }
    @keyframes title-drift { to { background-position: 46% 34%; opacity: .55; } }

    .title-lockup {
      position: relative; text-align: center;
      animation: title-rise .8s cubic-bezier(.16,.84,.28,1) both;
    }
    @keyframes title-rise { from { transform: translateY(18px); opacity: 0; filter: blur(6px); } }
    .title-crest {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      margin-bottom: clamp(13px, 2.1vh, 22px);
    }
    .title-crest span {
      width: 9px; height: 9px; transform: rotate(45deg);
      background: #f0b429; box-shadow: 0 0 15px rgba(240,180,41,.7);
    }
    .title-crest span:nth-child(2) {
      width: 15px; height: 15px; background: #ffdf9c; box-shadow: 0 0 22px rgba(255,214,130,.85);
    }
    #title {
      margin: 0; color: #f4f8fb;
      font-size: clamp(56px, 11.5vw, 132px); line-height: .86;
      letter-spacing: clamp(6px, 1.3vw, 17px); text-indent: clamp(6px, 1.3vw, 17px);
      text-shadow: 0 2px 0 #495563, 0 5px 0 #19212a, 0 16px 44px rgba(0,0,0,.88);
    }
    #title .accent {
      color: #ffc94d;
      text-shadow: 0 2px 0 #9a6c14, 0 5px 0 #3a2708,
        0 16px 44px rgba(0,0,0,.88), 0 0 48px rgba(255,190,70,.42);
    }
    #overlay .subtitle {
      margin: clamp(14px, 2vh, 20px) 0 0; color: #a8bccb;
      font-size: clamp(10px, 1.15vw, 13px); letter-spacing: clamp(4px, .8vw, 9px);
      text-transform: uppercase; text-shadow: 0 2px 5px rgba(0,0,0,.8);
    }
    #overlay .subtitle b { color: #f0b429; font-weight: 400; }

    /* ── Entry card (login / register, then the menu) ───────────────────── */
    .entry-card {
      position: relative; width: min(430px, 100%);
      animation: card-rise .8s .1s cubic-bezier(.16,.84,.28,1) both;
    }
    @keyframes card-rise { from { transform: translateY(22px); opacity: 0; } }
    #auth, #menu-btns {
      flex-direction: column; gap: 14px;
      padding: clamp(20px, 3.4vw, 28px);
      border: 1px solid rgba(215,232,245,.14); border-radius: 15px;
      background: linear-gradient(180deg, rgba(18,25,34,.90), rgba(7,11,17,.95));
      box-shadow: 0 30px 72px rgba(0,0,0,.62), inset 0 1px rgba(255,255,255,.09);
      backdrop-filter: blur(16px);
    }
    #auth { display: flex; }

    .auth-tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px;
      border: 1px solid rgba(255,255,255,.07); border-radius: 11px; background: rgba(0,0,0,.42);
    }
    .auth-tab {
      appearance: none; border: 0; border-radius: 8px; cursor: pointer;
      min-height: 40px; padding: 10px 8px; font-family: inherit; font-size: 11px;
      letter-spacing: 1.6px; text-transform: uppercase; text-shadow: none;
      color: #8ea3b3; background: transparent; transition: color .15s, background .15s;
    }
    .auth-tab:hover { color: #dce7f0; }
    .auth-tab.active {
      color: #17120a; background: linear-gradient(180deg, #ffdf9c, #f0b429);
      box-shadow: 0 5px 16px rgba(240,180,41,.28);
    }
    .auth-tab:focus-visible { outline: 2px solid #ffd98a; outline-offset: 2px; }

    .auth-lede { color: #92a7b6; font-size: 11px; line-height: 1.55; text-shadow: none; }
    .field-label {
      display: flex; flex-direction: column; gap: 8px;
      color: #7e94a4; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; text-shadow: none;
    }
    #auth-user-row { display: flex; gap: 8px; }
    #auth-user-row #auth-user { flex: 1; min-width: 0; }
    #auth input {
      width: 100%; min-height: 48px; padding: 12px 14px; border-radius: 10px; outline: none;
      color: #f2f7fa; background: rgba(0,0,0,.46); border: 1px solid rgba(255,255,255,.12);
      font-family: inherit; font-size: 14px; letter-spacing: .5px; text-shadow: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    #auth input::placeholder { color: #5c6f7d; letter-spacing: 1px; }
    #auth input:focus {
      border-color: #f0b429; background: rgba(0,0,0,.6);
      box-shadow: 0 0 0 3px rgba(240,180,41,.16);
    }
    #auth input[readonly] { color: #ffdf9c; letter-spacing: 1.6px; cursor: default; }

    .mc-btn {
      font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; color: #eef7fa;
      padding: 10px 26px; background: linear-gradient(#6f7a80, #4e575c); border: 2px solid;
      border-color: #aeb9bd #343b3e #343b3e #aeb9bd; text-shadow: none;
      box-shadow: 0 7px 18px rgba(0,0,0,.32); transition: transform .1s, filter .14s, box-shadow .14s;
    }
    .mc-btn:hover { filter: brightness(1.14); transform: translateY(-1px); }
    .mc-btn:active { transform: translateY(1px); }

    /* The title screen drops the chiselled bevel for flat, legible buttons. */
    #overlay .mc-btn {
      min-height: 48px; padding: 12px 18px; border: 0; border-radius: 10px;
      font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #dfe9f1;
      background: linear-gradient(180deg, #2d3843, #1a222b);
      box-shadow: 0 8px 22px rgba(0,0,0,.42);
    }
    #overlay .mc-btn:hover { filter: brightness(1.2); }
    #overlay .mc-btn:focus-visible { outline: 2px solid #ffd98a; outline-offset: 2px; }
    #overlay #submit-btn, #overlay #play-btn {
      color: #17120a; background: linear-gradient(180deg, #ffdf9c, #eda81f);
      box-shadow: 0 10px 28px rgba(237,168,31,.32);
    }
    #overlay #submit-btn:hover, #overlay #play-btn:hover { filter: brightness(1.08); }
    #overlay #play-btn { min-height: 60px; font-size: 15px; letter-spacing: 4px; }
    #overlay #roll-btn {
      flex: 0 0 52px; padding: 0; font-size: 19px; letter-spacing: 0; color: #ffdf9c;
      background: linear-gradient(180deg, #303c48, #1c242d);
    }
    #overlay #logout-btn {
      min-height: 38px; font-size: 10px; letter-spacing: 2px; color: #7b8f9d;
      background: transparent; box-shadow: none;
    }
    #overlay #logout-btn:hover { color: #dce7f0; filter: none; }
    #auth-err, #auth-status {
      font-size: 11px; line-height: 1.45; text-align: center; text-shadow: none;
    }
    #auth-err:empty, #auth-status:empty { display: none; }
    #auth-err { color: #ff9a86; }
    #auth-status { color: #8fb9cb; }

    #menu-btns { display: none; } /* revealed as flex once authenticated */
    .menu-profile { text-align: center; }
    .menu-eyebrow { color: #7e94a4; font-size: 9px; letter-spacing: 2.4px; text-transform: uppercase; text-shadow: none; }
    #menu-user {
      margin-top: 9px; color: #ffdf9c; font-size: clamp(19px, 4.4vw, 26px);
      letter-spacing: 1.2px; text-shadow: none; overflow-wrap: anywhere;
    }
    .menu-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .title-footer {
      margin: 0; color: #64798a; font-size: 10px; letter-spacing: 1.6px;
      text-align: center; text-shadow: none;
    }
    .title-footer strong { color: #9fb4c2; font-weight: 400; }

    .faction-reveal {
      position: absolute; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
      padding: calc(28px + var(--safe-top)) calc(28px + var(--safe-right))
               calc(28px + var(--safe-bottom)) calc(28px + var(--safe-left));
      background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--faction-color, #65dcff) 15%, transparent), transparent 34%), rgba(2,6,10,.94);
      backdrop-filter: blur(10px);
    }
    .faction-reveal::before {
      content: ''; position: absolute; inset: 18px; border: 1px solid color-mix(in srgb, var(--faction-color, #65dcff) 28%, transparent); pointer-events: none;
    }
    .faction-card {
      width: min(690px, 100%); position: relative; padding: clamp(34px, 6vw, 64px); text-align: center;
      background: linear-gradient(145deg, rgba(16,28,36,.97), rgba(5,10,15,.98));
      border: 1px solid color-mix(in srgb, var(--faction-color, #65dcff) 42%, #314650);
      box-shadow: 0 34px 90px rgba(0,0,0,.74), inset 0 0 55px color-mix(in srgb, var(--faction-color, #65dcff) 5%, transparent);
      overflow: hidden;
    }
    .faction-card::before, .faction-card::after { content: ''; position: absolute; background: var(--faction-color, #65dcff); box-shadow: 0 0 16px var(--faction-color, #65dcff); }
    .faction-card::before { left: 0; top: 0; width: 110px; height: 2px; }
    .faction-card::after { right: 0; bottom: 0; width: 110px; height: 2px; }
    .faction-eyebrow { color: #8faab5; font-size: 8px; letter-spacing: 3px; text-transform: uppercase; text-shadow: none; }
    .faction-crest {
      width: 96px; height: 96px; display: grid; place-items: center; margin: 26px auto 20px;
      color: var(--faction-color, #65dcff); font-size: 38px; border: 1px solid color-mix(in srgb, var(--faction-color, #65dcff) 55%, transparent);
      transform: rotate(45deg); background: color-mix(in srgb, var(--faction-color, #65dcff) 7%, rgba(2,7,10,.82));
      box-shadow: 0 0 34px color-mix(in srgb, var(--faction-color, #65dcff) 14%, transparent);
    }
    .faction-crest span { transform: rotate(-45deg); }
    .faction-lead { color: #8ea7b2; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; text-shadow: none; }
    .faction-name { margin: 10px 0 0; color: var(--faction-color, #65dcff); font-size: clamp(42px, 8vw, 74px); letter-spacing: clamp(4px, 1vw, 9px); line-height: 1; text-shadow: 0 5px 0 rgba(0,0,0,.28), 0 0 34px color-mix(in srgb, var(--faction-color, #65dcff) 32%, transparent); }
    .faction-rule { max-width: 520px; margin: 22px auto 0; color: #b7cbd2; font-size: 11px; line-height: 1.75; text-shadow: none; }
    .faction-rule strong { color: #eef8fa; }
    .faction-continue { margin-top: 28px; min-width: 220px; color: #071014; background: var(--faction-color, #65dcff); border-color: #effcff #285d6c #285d6c #effcff; }

    /* First-play onboarding: a responsive mission briefing */
    .onboarding-shell {
      position: absolute; inset: 0; z-index: 26; display: none; align-items: center; justify-content: center;
      padding: calc(34px + var(--safe-top)) calc(34px + var(--safe-right))
               calc(34px + var(--safe-bottom)) calc(34px + var(--safe-left));
      background:
        radial-gradient(circle at 24% 46%, color-mix(in srgb, var(--brief-accent, #65dcff) 17%, transparent), transparent 33%),
        linear-gradient(115deg, rgba(2,6,10,.98), rgba(5,11,17,.94));
      overflow: hidden;
    }
    .onboarding-shell::before {
      content: ''; position: absolute; inset: 20px; border: 1px solid rgba(148,209,229,.18); pointer-events: none;
    }
    .onboarding-shell::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent 0 4px, rgba(130,220,255,.018) 4px 5px);
    }
    .onboarding-frame {
      width: min(1050px, 100%); min-height: min(620px, calc(100dvh - 90px)); position: relative; z-index: 1;
      display: grid; grid-template-columns: .85fr 1.15fr; background: rgba(6,13,19,.84);
      border: 1px solid rgba(123,192,216,.28); box-shadow: 0 34px 90px rgba(0,0,0,.72);
      overflow: hidden; backdrop-filter: blur(12px);
    }
    .onboarding-visual {
      position: relative; display: flex; flex-direction: column; justify-content: space-between;
      padding: clamp(28px, 4vw, 48px); overflow: hidden;
      background:
        linear-gradient(160deg, color-mix(in srgb, var(--brief-accent, #65dcff) 18%, #0c1820), #050b10 68%);
      border-right: 1px solid rgba(137,199,219,.18);
    }
    .onboarding-visual::before {
      content: ''; position: absolute; width: 330px; height: 330px; right: -170px; bottom: -170px;
      border: 1px solid color-mix(in srgb, var(--brief-accent, #65dcff) 35%, transparent);
      box-shadow: 0 0 0 42px rgba(255,255,255,.015), 0 0 0 84px rgba(255,255,255,.012);
      transform: rotate(45deg);
    }
    .brief-chapter { color: color-mix(in srgb, var(--brief-accent, #65dcff) 80%, white); font-size: 8px; letter-spacing: 3px; text-transform: uppercase; text-shadow: none; }
    .brief-icon {
      position: relative; width: 112px; height: 112px; display: grid; place-items: center; margin: 34px 0 24px;
      color: #fff; font-size: 50px; border: 1px solid color-mix(in srgb, var(--brief-accent, #65dcff) 55%, transparent);
      background: color-mix(in srgb, var(--brief-accent, #65dcff) 10%, rgba(2,7,10,.82));
      box-shadow: inset 0 0 34px color-mix(in srgb, var(--brief-accent, #65dcff) 9%, transparent),
        0 0 34px color-mix(in srgb, var(--brief-accent, #65dcff) 12%, transparent);
    }
    .brief-icon::before, .brief-icon::after { content: ''; position: absolute; background: var(--brief-accent, #65dcff); }
    .brief-icon::before { left: -1px; top: -1px; width: 25px; height: 2px; }
    .brief-icon::after { right: -1px; bottom: -1px; width: 2px; height: 25px; }
    .brief-number { color: rgba(224,241,247,.26); font-size: 10px; letter-spacing: 4px; text-shadow: none; }
    .brief-title { margin-top: 12px; max-width: 360px; color: #f0f8fa; font-size: clamp(27px, 3.2vw, 42px); line-height: 1.08; letter-spacing: 1px; text-shadow: none; }
    .brief-summary { margin-top: 18px; max-width: 390px; color: #aec4cc; font-size: 12px; line-height: 1.75; text-shadow: none; }
    .brief-tip { position: relative; margin-top: 28px; padding: 13px 14px 13px 34px; color: #c5d6dc; font-size: 9px; line-height: 1.55; background: rgba(0,0,0,.22); border-left: 2px solid var(--brief-accent, #65dcff); text-shadow: none; }
    .brief-tip::before { content: '◆'; position: absolute; left: 13px; top: 13px; color: var(--brief-accent, #65dcff); }

    .onboarding-content { display: flex; flex-direction: column; padding: clamp(28px, 4vw, 50px); background: linear-gradient(145deg, rgba(13,24,31,.94), rgba(5,10,15,.96)); }
    .brief-progress { display: flex; align-items: center; gap: 12px; }
    .brief-progress-track { flex: 1; height: 3px; background: #1a2a32; overflow: hidden; }
    .brief-progress-fill { height: 100%; width: 25%; background: var(--brief-accent, #65dcff); box-shadow: 0 0 12px var(--brief-accent, #65dcff); transition: width .28s ease; }
    .brief-progress-count { color: #718993; font-size: 8px; letter-spacing: 2px; text-shadow: none; }
    .brief-content-label { margin-top: 38px; color: #6f8994; font-size: 8px; letter-spacing: 2.5px; text-transform: uppercase; text-shadow: none; }
    .brief-items { display: grid; gap: 10px; margin-top: 14px; }
    .brief-item {
      display: grid; grid-template-columns: minmax(110px, .75fr) minmax(0, 1.25fr); gap: 18px; align-items: center;
      min-height: 62px; padding: 12px 14px; border: 1px solid rgba(114,169,188,.17);
      background: rgba(3,9,13,.48); transition: border-color .15s, transform .15s;
    }
    .brief-item:hover { border-color: color-mix(in srgb, var(--brief-accent, #65dcff) 43%, transparent); transform: translateX(2px); }
    .brief-item-label { color: color-mix(in srgb, var(--brief-accent, #65dcff) 76%, white); font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; text-shadow: none; }
    .brief-item-value { color: #d9e5e9; font-size: 10px; line-height: 1.55; text-shadow: none; }
    .brief-actions { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 30px; }
    .brief-actions .mc-btn { min-height: 43px; padding: 9px 18px; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }
    .brief-back { background: transparent; border-color: #38505b; box-shadow: none; }
    .brief-back:disabled { opacity: .3; cursor: default; transform: none; filter: none; }
    .brief-skip { margin-left: auto; background: transparent; border-color: transparent; box-shadow: none; color: #6f8791; }
    .brief-next { min-width: 160px; color: #071014; background: var(--brief-accent, #65dcff); border-color: #e6fbff #1f697d #1f697d #e6fbff; box-shadow: 0 9px 26px color-mix(in srgb, var(--brief-accent, #65dcff) 20%, transparent); }

    @media (max-width: 920px) {
      .title-footer { display: none; }
      .onboarding-frame { grid-template-columns: 1fr; min-height: auto; max-height: calc(100dvh - 54px); overflow-y: auto; }
      .onboarding-visual { min-height: 270px; border-right: 0; border-bottom: 1px solid rgba(137,199,219,.18); }
      .brief-icon { width: 78px; height: 78px; margin: 20px 0 14px; font-size: 35px; }
      .brief-summary { max-width: 620px; }
      .brief-tip { display: none; }
    }
    @media (max-width: 640px), (max-height: 720px) {
      :root { --hotbar-slot: clamp(30px, 10.4vw, 40px); }
      #status { transform: translateX(-50%) scale(.84); }
      #ammo { font-size: 14px; }
      .vault-boss-hud > div:nth-child(3) { gap: 4px !important; }
      #overlay {
        gap: 18px;
        padding: calc(18px + var(--safe-top)) calc(16px + var(--safe-right))
                 calc(18px + var(--safe-bottom)) calc(16px + var(--safe-left));
      }
      .title-crest { margin-bottom: 10px; }
      .title-crest span { width: 7px; height: 7px; }
      .title-crest span:nth-child(2) { width: 11px; height: 11px; }
      #title { font-size: clamp(46px, 16vw, 76px); }
      #overlay .subtitle { margin-top: 11px; font-size: 9px; letter-spacing: 3px; }
      #auth, #menu-btns { padding: 18px; gap: 12px; }
      #overlay #play-btn { min-height: 54px; }
      .onboarding-shell { padding: calc(10px + var(--safe-top)) calc(10px + var(--safe-right)) calc(10px + var(--safe-bottom)) calc(10px + var(--safe-left)); }
      .onboarding-shell::before { inset: 5px; }
      .onboarding-frame { max-height: calc(100dvh - 20px); }
      .onboarding-visual, .onboarding-content { padding: 22px; }
      .onboarding-visual { min-height: 220px; }
      .brief-icon { width: 62px; height: 62px; margin: 14px 0 10px; font-size: 28px; }
      .brief-title { font-size: 25px; }
      .brief-summary { margin-top: 10px; font-size: 10px; line-height: 1.55; }
      .brief-content-label { margin-top: 24px; }
      .brief-item { grid-template-columns: 1fr; gap: 5px; min-height: 0; padding: 10px 12px; }
      .brief-actions { flex-wrap: wrap; padding-top: 20px; }
      .brief-skip { order: 3; width: 100%; margin-left: 0; }
      .brief-next { flex: 1; min-width: 130px; }
    }
    /* Too short to centre a full lockup: pin to the top and let it scroll. */
    @media (max-height: 700px) {
      #overlay { justify-content: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) {
      #overlay::before { animation: none; }
      .title-lockup, .entry-card { animation: none; }
      .brief-progress-fill { transition: none; }
    }


  </style>
</head>
<body>
  <div id="app">
    <div id="crosshair"></div>
    <div id="ammo" class="mc-font"></div>
    <div id="hotbar"></div>
    <div id="status">
      <canvas id="hearts" width="202" height="40"></canvas>
      <canvas id="energybar" width="202" height="20"></canvas>
      <canvas id="bubbles" width="202" height="20"></canvas>
      <canvas id="armor" width="202" height="20"></canvas>
    </div>
    <div id="damage-flash"></div>
    <div id="death">
      <h1 class="mc-font">You died!</h1>
      <button id="respawn" class="mc-font">Respawn</button>
    </div>
    <div id="pause">
      <h1 class="mc-font">Paused</h1>
      <div id="vault-accessibility" class="mc-font">
        <label>Music <input id="music-volume" type="range" min="0" max="1" step="0.05" /></label>
        <label>Effects <input id="effects-volume" type="range" min="0" max="1" step="0.05" /></label>
        <label>Camera shake <input id="camera-shake" type="range" min="0" max="1" step="0.1" /></label>
        <label>Reduced motion <input id="reduced-motion" type="checkbox" /></label>
        <label>High-contrast telegraphs <input id="contrast-telegraphs" type="checkbox" /></label>
        <label>Photosensitivity safe <input id="safe-effects" type="checkbox" /></label>
      </div>
      <button id="resume-btn" class="mc-btn">Resume</button>
      <button id="pause-guide-btn" class="mc-btn">Field Guide</button>
      <button id="quit-btn" class="mc-btn">Quit to Title</button>
    </div>
    <div id="debug" class="mc-font"></div>
    <div id="overlay" class="hidden">
      <header class="title-lockup">
        <div class="title-crest" aria-hidden="true"><span></span><span></span><span></span></div>
        <h1 id="title" class="mc-font"><span class="accent">VOXEL</span><span>ON</span></h1>
        <p class="subtitle mc-font">Mine <b>·</b> Build <b>·</b> Conquer <b>·</b> Survive</p>
      </header>

      <section class="entry-card" aria-label="World access">
        <div id="auth">
          <div class="auth-tabs" role="tablist" aria-label="Account">
            <button id="tab-register" class="auth-tab mc-font" type="button" role="tab" aria-selected="true">New here</button>
            <button id="tab-login" class="auth-tab mc-font" type="button" role="tab" aria-selected="false">Returning</button>
          </div>
          <p id="auth-mode-label" class="auth-lede mc-font">Create your identity</p>
          <label class="field-label mc-font" for="auth-user">
            Callsign
            <span id="auth-user-row">
              <input id="auth-user" class="mc-font" placeholder="username" maxlength="16" autocomplete="username" readonly />
              <button id="roll-btn" class="mc-btn" type="button" title="Roll a new random username" aria-label="Roll a new username">&#8635;</button>
            </span>
          </label>
          <label class="field-label mc-font" for="auth-pass">
            Passphrase
