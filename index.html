<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOXELON</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #app { width: 100%; height: 100%; position: relative; }
    canvas.game { display: block; image-rendering: pixelated; }

    .mc-font {
      font-family: 'Lucida Console', Monaco, monospace;
      font-weight: bold;
      color: #fff;
      /* Soft legibility shadow for text floating over the 3D scene (no chunky
         pixel drop-shadow). Panels on solid backgrounds override to none. */
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      letter-spacing: 0.5px;
    }

    /* Crosshair: vanilla-style plus with difference blending */
    #crosshair {
      position: absolute; left: 50%; top: 50%;
      width: 22px; height: 22px;
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;
      pointer-events: none;
      z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: #ddd;
    }
    #crosshair::before { left: 9px; top: 0; width: 4px; height: 22px; }
    #crosshair::after  { left: 0; top: 9px; width: 22px; height: 4px; }

    /* Hotbar */
    #hotbar {
      position: absolute; bottom: 8px; left: 50%;
      transform: translateX(-50%);
      display: flex;
      background: rgba(0,0,0,0.55);
      border: 2px solid #000;
      outline: 2px solid rgba(255,255,255,0.25);
      z-index: 10;
      pointer-events: none;
    }
    .slot {
      width: 48px; height: 48px;
      border: 2px solid #8b8b8b;
      border-right-color: #555; border-bottom-color: #555;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .slot.selected::after {
      content: ''; position: absolute; inset: -4px;
      border: 4px solid #fff;
      outline: 2px solid #000;
      z-index: 2;
    }
    .slot canvas { width: 36px; height: 36px; image-rendering: pixelated; }
    .slot .count {
      position: absolute; right: 2px; bottom: 0;
      font-size: 14px; pointer-events: none; z-index: 3;
    }

    /* Inventory panel */
    #inventory {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      display: none; flex-direction: column; gap: 6px;
      background: #c6c6c6;
      border: 3px solid;
      border-color: #fff #555 #555 #fff;
      padding: 10px 12px 12px;
      z-index: 25;
    }
    .inv-title { color: #3f3f3f; text-shadow: none; font-size: 15px; }
    /* Warfare panels (machine / turret / ship / faction Core): consistent modern
       chrome — flat bevel buttons with a subtle hover, no chunky text shadows. */
    .war-btn {
      flex: 1; font-size: 10px; padding: 6px 4px; cursor: pointer;
      border: 2px solid; border-color: #fff #555 #555 #fff;
      background: #6b6b6b; color: #fff; text-shadow: none;
      white-space: pre-line; transition: background 0.12s;
    }
    .war-btn:hover:enabled { background: #7c8b9c; }
    .war-btn:disabled { cursor: default; }
    .war-bar { position: relative; border: 2px solid #2a2a2a; background: #1c1c1c; }
    .war-bar span {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; font-size: 10px; text-shadow: none; color: #fff;
    }
    .inv-grid {
      display: grid; grid-template-columns: repeat(9, 48px);
    }
    .inv-hotbar { margin-top: 10px; }
    .inv-slot {
      background: #8b8b8b;
      border-color: #373737 #fff #fff #373737;
      cursor: pointer;
    }
    #cursor-stack {
      position: absolute; display: none; pointer-events: none; z-index: 40;
      width: 32px; height: 32px;
    }
    #cursor-stack canvas { width: 32px; height: 32px; image-rendering: pixelated; }
    #cursor-stack .count {
      position: absolute; right: -4px; bottom: -4px; font-size: 14px;
    }
    #tooltip {
      position: absolute; display: none; pointer-events: none; z-index: 41;
      background: rgba(16, 0, 16, 0.94);
      border: 2px solid #25015a;
      padding: 4px 8px; font-size: 14px;
    }

    /* Crafting / furnace top sections */
    .inv-top { min-height: 52px; display: flex; justify-content: center; }
    .craft-row { display: flex; align-items: center; gap: 14px; }
    .craft-arrow {
      width: 44px; height: 14px; background: #8b8b8b;
      border: 2px solid #555;
    }
    .craft-arrow div { height: 100%; width: 0%; background: #fff; }
    .flame {
      width: 14px; height: 14px; background: #555;
      display: flex; align-items: flex-end;
    }
    .flame div { width: 100%; height: 0%; background: #ff9010; }
    .result-slot { margin-left: 4px; }
    .durbar {
      position: absolute; left: 6px; bottom: 4px; height: 3px;
      display: none; z-index: 3; background: #5fe552;
    }

    /* Survival HUD */
    #status {
      position: absolute; bottom: 62px; left: 50%;
      transform: translateX(-50%);
      width: 444px; z-index: 10; pointer-events: none;
    }
    #status canvas { image-rendering: pixelated; }
    #hearts { position: absolute; left: 0; bottom: 0; }
    #energybar { position: absolute; right: 0; bottom: 0; }
    #bubbles { position: absolute; right: 0; bottom: 22px; }
    #armor { position: absolute; left: 0; bottom: 22px; }
    #ammo {
      position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%);
      z-index: 10; pointer-events: none; font-size: 18px; display: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); color: #fff;
    }

    #damage-flash {
      position: absolute; inset: 0; background: #f00;
      opacity: 0; pointer-events: none; z-index: 15;
    }

    #death {
      position: absolute; inset: 0; background: rgba(120, 0, 0, 0.55);
      display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 26px; z-index: 50;
    }
    #death h1 { font-size: 44px; }
    #death button {
      font-family: inherit; font-size: 18px; font-weight: bold;
      padding: 10px 36px; cursor: pointer;
      background: #8b8b8b; color: #fff; text-shadow: none;
      border: 3px solid; border-color: #fff #555 #555 #fff;
    }

    /* Pause menu (over the frozen first-person view; not the title panorama) */
    #pause {
      position: absolute; inset: 0; background: rgba(8, 8, 14, 0.55);
      display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; z-index: 22;
    }
    #pause h1 { font-size: 48px; letter-spacing: 4px; }

    /* Debug overlay (F3) */
    #debug {
      position: absolute; top: 4px; left: 4px;
      font-size: 14px; line-height: 19px;
      display: none; z-index: 10; pointer-events: none;
      white-space: pre;
    }
    #debug .line { background: rgba(80,80,80,0.45); padding: 0 4px; display: inline-block; }

    /* Title / pause menu over the live panorama */
    #overlay {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 50% 34%, rgba(0,0,0,0) 0%, rgba(6,8,16,0.42) 68%, rgba(4,6,12,0.72) 100%),
        linear-gradient(rgba(8,8,14,0.12), rgba(6,8,14,0.5));
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; z-index: 20;
    }
    #overlay.hidden { display: none; }
    #title {
      font-size: 92px; letter-spacing: 12px; margin-bottom: 4px;
      color: #f2f4f8;
      text-shadow:
        0 3px 0 rgba(0,0,0,0.45),
        0 10px 30px rgba(0, 0, 0, 0.75),
        0 0 42px rgba(110, 170, 255, 0.25);
      animation: title-drop 0.7s cubic-bezier(0.2, 1.4, 0.4, 1) both;
    }
    #title .accent {
      color: #e2483a; /* the VOXEL in VOXELON */
      text-shadow:
        0 3px 0 rgba(0,0,0,0.45),
        0 10px 30px rgba(0, 0, 0, 0.75),
        0 0 42px rgba(255, 90, 60, 0.35);
    }
    @keyframes title-drop {
      from { transform: translateY(-26px) scale(1.05); opacity: 0; }
      to   { transform: none; opacity: 1; }
    }
    #overlay .subtitle {
      font-size: 15px; color: #cdd8ea; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
      margin-top: -12px; letter-spacing: 3px;
    }
    #overlay .subtitle .sub-dot { color: #6fa8ff; }
    /* Vanilla-style button (same bevel as the death screen). */
    .mc-btn {
      font-family: inherit; font-size: 20px; font-weight: bold;
      padding: 12px 64px; cursor: pointer;
      background: #6b6b6b; color: #fff; text-shadow: none;
      border: 3px solid; border-color: #fff #555 #555 #fff;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      transition: background 0.12s, transform 0.08s;
    }
    .mc-btn:hover { background: #7c8b9c; transform: translateY(-1px); }
    .mc-btn:active { transform: translateY(1px); }
    /* The big Play button pops. */
    #play-btn {
      background: linear-gradient(#4f8f45, #3f7a37); border-color: #9fd48f #24481f #24481f #9fd48f;
      letter-spacing: 2px;
    }
    #play-btn:hover { background: linear-gradient(#5aa04f, #48883f); }
    /* Login / register form on the title overlay — a soft card. */
    #auth {
      display: flex; flex-direction: column; gap: 8px; width: 280px; margin: 8px 0 4px;
      background: rgba(10, 13, 22, 0.72);
      border: 1px solid #2c3650; border-radius: 10px;
      padding: 16px 18px 14px;
      box-shadow: 0 10px 34px rgba(0,0,0,0.5);
      backdrop-filter: blur(3px);
    }
    #auth input {
      font-size: 14px; padding: 9px 10px; color: #eee; background: #0f1420;
      border: 2px solid; border-color: #2a3550 #4a5775 #4a5775 #2a3550; text-shadow: none;
      border-radius: 4px;
      outline: none;
    }
    #auth input:focus { border-color: #6fd0ff; }
    #auth input[readonly] { color: #cfe0ff; cursor: default; }
    /* Auth buttons are compact + centered (the big 64px padding is for Play). */
    #auth .mc-btn {
      font-size: 18px; padding: 10px 12px; text-align: center;
      display: flex; align-items: center; justify-content: center;
    }
    #submit-btn { width: 100%; }
    #auth-user-row { display: flex; gap: 8px; align-items: stretch; }
    #auth-user-row #auth-user { flex: 1; min-width: 0; }
    #roll-btn { flex: 0 0 auto; padding: 10px 14px; font-size: 18px; }
    #auth-toggle { font-size: 12px; color: #9fb4cc; text-shadow: none; text-align: center; }
    #toggle-link { color: #6fd0ff; cursor: pointer; text-decoration: underline; }
    #auth-err { color: #ff8a7a; font-size: 12px; min-height: 14px; text-shadow: none; text-align: center; }
    #auth-status { color: #9fb4cc; font-size: 12px; min-height: 14px; text-shadow: none; text-align: center; }

  </style>
</head>
<body>
  <div id="app">
    <div id="crosshair"></div>
    <div id="ammo" class="mc-font"></div>
    <div id="hotbar"></div>
    <div id="status">
      <canvas id="hearts" width="202" height="40"></canvas>
      <canvas id="energybar" width="202" height="20"></canvas>
      <canvas id="bubbles" width="202" height="20"></canvas>
      <canvas id="armor" width="202" height="20"></canvas>
    </div>
    <div id="damage-flash"></div>
    <div id="death">
      <h1 class="mc-font">You died!</h1>
      <button id="respawn" class="mc-font">Respawn</button>
    </div>
    <div id="pause">
      <h1 class="mc-font">Paused</h1>
      <button id="resume-btn" class="mc-btn">Resume</button>
      <button id="quit-btn" class="mc-btn">Quit to Title</button>
    </div>
    <div id="debug" class="mc-font"></div>
    <div id="overlay" class="hidden">
      <h1 id="title" class="mc-font"><span class="accent">VOXEL</span>ON</h1>
      <p class="subtitle mc-font">mine <span class="sub-dot">·</span> build <span class="sub-dot">·</span> explore <span class="sub-dot">·</span> WAR</p>
      <div id="auth">
        <div id="auth-user-row">
          <input id="auth-user" class="mc-font" placeholder="username" maxlength="16" autocomplete="username" readonly />
          <button id="roll-btn" class="mc-btn" type="button" title="Roll a new random username">🎲</button>
        </div>
        <input id="auth-pass" class="mc-font" type="password" placeholder="password" autocomplete="current-password" />
        <button id="submit-btn" class="mc-btn">Register</button>
        <div id="auth-toggle" class="mc-font">Already have an account? <a id="toggle-link">Log in</a></div>
        <div id="auth-err" class="mc-font"></div>
        <div id="auth-status" class="mc-font"></div>
      </div>
      <div id="menu-btns" style="display:none; flex-direction:column; gap:12px; align-items:center;">
        <button id="play-btn" class="mc-btn">Play</button>
        <button id="controls-btn" class="mc-btn">Controls</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
